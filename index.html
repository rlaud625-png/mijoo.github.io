<title>HSK 단어 퀴즈</title>
<style>
:root {
  --bg: #fbf7f2; --card: #ffffff; --ink: #1f1b16; --muted: #6f665c; --line: #e8e0d6;
  --accent: #c2410c; --accent-ink: #ffffff; --accent-soft: #fde8dc;
  --ok: #15803d; --ok-soft: #dcfce7; --bad: #b91c1c; --bad-soft: #fee2e2;
  --chip: #f3ede6; --shadow: 0 1px 2px rgba(60,40,20,.06), 0 4px 16px rgba(60,40,20,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a1714; --card: #24201c; --ink: #f2ece5; --muted: #a89d90; --line: #38322c;
    --accent: #f97316; --accent-ink: #1a1714; --accent-soft: #3b2417;
    --ok: #4ade80; --ok-soft: #14301f; --bad: #f87171; --bad-soft: #3a1a1a;
    --chip: #2e2924; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #1a1714; --card: #24201c; --ink: #f2ece5; --muted: #a89d90; --line: #38322c;
  --accent: #f97316; --accent-ink: #1a1714; --accent-soft: #3b2417;
  --ok: #4ade80; --ok-soft: #14301f; --bad: #f87171; --bad-soft: #3a1a1a;
  --chip: #2e2924; --shadow: none;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  font-size: 16px; line-height: 1.5; touch-action: manipulation;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.zh { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
.wrap { max-width: 560px; margin: 0 auto; padding: 16px 16px 40px; }
h1 { font-size: 22px; margin: 8px 0 2px; letter-spacing: -0.01em; }
.sub { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow); }
.card h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 10px; letter-spacing: .02em; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 999px;
  padding: 8px 14px; font-size: 15px; cursor: pointer; user-select: none; min-height: 40px;
}
.chip small { color: var(--muted); margin-left: 4px; font-size: 12px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip[aria-pressed="true"] small { color: inherit; opacity: .8; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg .chip { border-radius: 12px; text-align: left; padding: 10px 12px; }
.seg .chip b { display: block; font-size: 15px; }
.seg .chip span { display: block; font-size: 12px; opacity: .75; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.switch { position: relative; width: 50px; height: 30px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch span { position: absolute; inset: 0; background: var(--line); border-radius: 999px; transition: .2s; }
.switch span::before { content: ""; position: absolute; width: 24px; height: 24px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::before { transform: translateX(20px); }
.btn {
  display: block; width: 100%; border: 0; border-radius: 14px; padding: 15px; font-size: 17px; font-weight: 600;
  background: var(--accent); color: var(--accent-ink); cursor: pointer; margin-top: 8px;
}
.btn.secondary { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
.btn:disabled { opacity: .45; cursor: default; }
.linkbtn { background: none; border: 0; color: var(--accent); font-size: 15px; padding: 12px; width: 100%; cursor: pointer; }
.avail { text-align: center; color: var(--muted); font-size: 14px; margin: 4px 0 0; }
.avail b { color: var(--ink); }

.qtop { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.x { background: none; border: 0; font-size: 26px; line-height: 1; color: var(--muted); padding: 4px 8px; cursor: pointer; }
.bar { flex: 1; height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s; }
.count { font-size: 14px; color: var(--muted); min-width: 52px; text-align: right; font-variant-numeric: tabular-nums; }
.qhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
.qtype { display: inline-block; font-size: 12px; font-weight: 600; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 3px 10px; }
.pytoggle {
  border: 1px solid var(--line); background: var(--card); color: var(--muted); border-radius: 999px;
  font-size: 13px; padding: 6px 12px; cursor: pointer; min-height: 34px;
}
.pytoggle[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.prompt { text-align: center; padding: 22px 8px 26px; }

.prompt .ko { font-size: 22px; font-weight: 600; }

.sentence.py { line-height: 2.5; }

rt { font-size: .58em; color: var(--accent); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
.blank { display: inline-block; min-width: 3em; border-bottom: 2px solid var(--accent); text-align: center; color: var(--accent); }
.opts { display: grid; gap: 10px; }

}

.opt.ok { border-color: var(--ok); background: var(--ok-soft); }

.opt.bad { border-color: var(--bad); background: var(--bad-soft); }

.info .p { font-size: 17px; color: var(--accent); }

.info .meaning { font-size: 17px; margin: 6px 0 0; }
.info .ex { margin: 10px 0 0; font-size: 16px; line-height: 1.75; }
.info .ex.py { line-height: 2.4; }
.info .src { margin-top: 8px; font-size: 12px; color: var(--muted); }
mark { background: var(--accent-soft); color: var(--accent); border-radius: 4px; padding: 0 2px; font-weight: 600; }
.verdict { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
.verdict.ok { color: var(--ok); } .verdict.bad { color: var(--bad); }
.explain h2 { margin-bottom: 4px; }

.ex-row:first-of-type { border-top: 0; }
.ex-row .k { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--chip); color: var(--muted); font-size: 12px; font-weight: 700; display: grid; place-items: center; margin-top: 2px; }

.ex-row .ep { color: var(--accent); font-size: 15px; }

.ex-row .tag.pick { color: var(--bad); background: var(--bad-soft); }
.ex-row .em { font-size: 15px; margin-top: 2px; }

.sticky { position: sticky; bottom: 0; padding: 10px 0 calc(6px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--bg) 30%); }

/* result + notebook */
.score { text-align: center; padding: 18px 0 8px; }
.score .num { font-size: 56px; font-weight: 700; line-height: 1; }
.score .pct { color: var(--muted); margin-top: 6px; }

.empty { text-align: center; color: var(--muted); padding: 24px 0; }
.note { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
.hidden { display: none !important; }

/* pick n other words that look alike (same POS / level / length) and give distinct option labels */
function distractors(it, n, labelOf, poolItems) {
  const seen = new Set([labelOf(it)]);
  const score = o => (o.pos === it.pos ? 4 : 0) + (o.lv === it.lv ? 2 : 0) + (o.w.length === it.w.length ? 1 : 0) + Math.random();
  const out = [];
  for (const o of shuffle(poolItems.filter(o => o.w !== it.w)).sort((a, b) => score(b) - score(a))) {
    const v = labelOf(o);
    if (seen.has(v)) continue;
    seen.add(v); out.push(o);
    if (out.length === n) break;

    for (const o of shuffle(poolItems.filter(o => o.w !== it.w && o.w.length === it.w.length))) {
      if (used.has(o.p)) continue;
      used.add(o.p); others.push(wordOpt(o, o.p));
      if (tone.length + others.length === 3) break;
    }
    const opts = shuffle([wordOpt(it, it.p), ...tone, ...others].slice(0, 4));
    return { ...q, opts, answer: opts.findIndex(o => o.w === it.w), zhOpts: false };
  }
  // cloze: a real exam blank (original options + per-option explanation) when available
  const exam = examClozeFor(it);
  if (exam.length && (it.exIdx < 0 || Math.random() < 0.75)) {
    const c = exam[Math.random() * exam.length | 0];
    const order = shuffle([0, 1, 2, 3]);
    const opts = order.map(i => ({ label: c.o[i], w: c.o[i], why: c.e[i] }));
    const full = c.s.map(s => s[0] === "＿＿" ? [it.w, it.p] : s);
    return { ...q, opts, answer: order.indexOf(c.a), zhOpts: true, segs: c.s, full, src: c.src, real: true };
  }
  const segs = it.ex.map((s, i) => i === it.exIdx ? ["＿＿", ""] : s);
  const opts = shuffle([
    wordOpt(it, it.w, "정답. 원래 문장에 쓰인 단어예요."),
    ...distractors(it, 3, o => o.w, poolItems).map(o => wordOpt(o, o.w, "이 문장의 원래 단어가 아니에요. 뜻을 넣어 읽어 보고 어색한 점을 확인해 보세요.")),
  ]);
  return { ...q, opts, answer: opts.findIndex(o => o.w === it.w), zhOpts: true, segs, full: it.ex, src: it.src, real: false };
}

function record(w, type, correct) {
  const key = w + "|" + type;
  const e = wrong[key];
  if (!correct) {
    wrong[key] = { w, t: type, miss: (e ? e.miss : 0) + 1, streak: 0, at: Date.now() };
  } else if (e) {
    e.streak += 1;
    if (e.streak >= STREAK_TO_CLEAR) delete wrong[key];
  }
  saveWrong();
}
const wrongEntries = () => Object.values(wrong).filter(e => LEX[e.w]);

/* ---------- screens ---------- */
let session = null;

function renderHome() {
  const isReading = settings.set === "reading";
  const lvCount = lv => ITEMS.reading.filter(it => it.lv === lv).length;
  const p = pool();
  const n = settings.count ? Math.min(settings.count, p.length) : p.length;
  const wn = wrongEntries().length;
  $("#app").innerHTML = `
    <h1>HSK 5급 단어 퀴즈</h1>
    <p class="sub">기출 ${DATA.exams.length}회분 독해 1부분 · 공식 HSK 5급 어휘표</p>

    <section class="card"><h2>출제 단어</h2><div class="seg" id="set">
      ${Object.entries(SETS).map(([id, s]) => `<button class="chip" data-v="${id}" aria-pressed="${settings.set === id}">
        <b>${s.label}</b><span>${s.note} · ${ITEMS[id].length.toLocaleString()}개</span></button>`).join("")}
    </div></section>

    ${isReading ? `
    <section class="card"><h2>급수 (구 HSK 공식 어휘표)</h2><div class="chips" id="lv">
      ${[4, 5, 6].map(l => `<button class="chip" data-v="${l}" aria-pressed="${settings.levels.includes(l)}">${l}급<small>${lvCount(l)}</small></button>`).join("")}
    </div></section>` : ""}

    <section class="card"><h2>문제 유형</h2><div class="chips" id="ty">
      ${TYPES.map(t => `<button class="chip" data-v="${t.id}" aria-pressed="${settings.types.includes(t.id)}">${t.label}</button>`).join("")}
    </div>${!isReading && settings.types.includes("cloze") ? `<p class="note">빈칸 채우기는 기출 지문에 나온 5급 단어에서만 나와요.</p>` : ""}</section>

    ${isReading ? `
    <section class="card"><h2>회차</h2><div class="chips" id="ex">
      <button class="chip" data-v="" aria-pressed="${!settings.exams.length}">전체</button>
      ${DATA.exams.map(e => `<button class="chip" data-v="${e}" aria-pressed="${settings.exams.includes(e)}">${esc(examName(e))}</button>`).join("")}
    </div></section>

    <section class="card"><div class="row">
      <div><div>기출 선택지 단어만</div><div class="note">빈칸 문제의 정답·오답 선택지로 나온 단어</div></div>
      <label class="switch"><input type="checkbox" id="opt" ${settings.onlyOpt ? "checked" : ""}><span></span></label>
    </div></section>` : ""}

    <section class="card"><h2>문제 수</h2><div class="chips" id="cnt">
      ${COUNTS.map(c => `<button class="chip" data-v="${c}" aria-pressed="${settings.count === c}">${c ? c + "문제" : "전체"}</button>`).join("")}
    </div></section>

    <p class="avail">출제 가능 <b>${p.length}</b>단어 · 이번에 <b>${n}</b>문제</p>
    <button class="btn" id="start" ${n ? "" : "disabled"}>시작하기</button>
    <button class="btn secondary" id="redo" ${wn ? "" : "disabled"}>오답만 풀기 (${wn})</button>
    <button class="linkbtn" id="nb">오답 노트 · 백업</button>
  `;
  const onChip = (id, fn) => { const el = $(id); if (el) el.addEventListener("click", ev => { const b = ev.target.closest(".chip"); if (b) { fn(b.dataset.v); saveSettings(); renderHome(); } }); };
  const toggleIn = (arr, v) => { const i = arr.indexOf(v); if (i >= 0) { if (arr.length > 1) arr.splice(i, 1); } else arr.push(v); };
  onChip("#set", v => { settings.set = v; });
  onChip("#lv", v => toggleIn(settings.levels, Number(v)));
  onChip("#ty", v => toggleIn(settings.types, v));
  onChip("#ex", v => {
    if (!v) settings.exams = [];
    else { const i = settings.exams.indexOf(v); if (i >= 0) settings.exams.splice(i, 1); else settings.exams.push(v); }
  });
  onChip("#cnt", v => { settings.count = Number(v); });
  if ($("#opt")) $("#opt").addEventListener("change", ev => { settings.onlyOpt = ev.target.checked; saveSettings(); renderHome(); });
  $("#start").addEventListener("click", startNormal);
  $("#redo").addEventListener("click", startWrong);
  $("#nb").addEventListener("click", renderNotebook);
}

function startNormal() {
  const poolItems = ITEMS[settings.set];
  const words = shuffle(pool());
  const take = settings.count ? words.slice(0, settings.count) : words;
  const qs = take.map(it => {
    const types = settings.types.filter(t => canType(it, t));
    return makeQuestion(it, types[Math.random() * types.length | 0], poolItems);
  });
  startSession(qs, false);
}
function startWrong() {
  let es = shuffle(wrongEntries());
  if (settings.count) es = es.slice(0, settings.count);
  const qs = es.map(e => {
    const it = item(e.w);
    const poolItems = ITEMS[readingBy.has(e.w) ? "reading" : "hsk5"];
    const exams = settings.exams; settings.exams = [];          // 오답은 회차 필터와 상관없이 출제
    const t = canType(it, e.t) ? e.t : "meaning";
    const q = makeQuestion(it, t, poolItems);
    settings.exams = exams;
    return q;
  });
  startSession(qs, true);
}
function startSession(qs, wrongMode) {
  if (!qs.length) return;
  session = { qs, i: 0, right: 0, missed: [], wrongMode, answered: false, py: false, pick: -1 };
  renderQuestion();
}

function renderQuestion() {
  const s = session, q = s.qs[s.i], it = q.it;
  const py = s.py;
  let prompt;
  if (q.type === "meaning" || q.type === "pinyin") {
    prompt = `<div class="prompt"><div class="big zh" lang="zh-CN">${esc(it.w)}</div>
      ${q.type === "meaning" && py ? `<div class="bigpy">${esc(it.p)}</div>` : ""}
      <div class="hint">${q.type === "meaning" ? "알맞은 뜻을 고르세요" : "알맞은 병음을 고르세요"}</div></div>`;
  } else if (q.type === "hanzi") {
    prompt = `<div class="prompt"><div class="ko">${esc(it.ko)}</div>
      <div class="hint">${esc(it.pos)} · 알맞은 중국어를 고르세요</div></div>`;
  } else {
    prompt = `<div class="sentence zh ${py ? "py" : ""}" lang="zh-CN">${sentenceHtml(q.segs, py)}</div>`;
  }
  const canPy = q.type !== "pinyin";   // 병음 문제에서는 병음이 곧 정답이라 보기 버튼을 숨김
  $("#app").innerHTML = `
    <div class="qtop">
      <button class="x" id="quit" aria-label="그만하기">×</button>
      <div class="bar"><i style="width:${(s.i / s.qs.length) * 100}%"></i></div>
      <div class="count">${s.i + 1} / ${s.qs.length}</div>
    </div>
    <div class="qhead">
      <span class="qtype">${s.wrongMode ? "오답 · " : ""}${TYPE_LABEL[q.type]}${q.real ? " · 기출" : ""}</span>
      ${canPy ? `<button class="pytoggle" id="py" aria-pressed="${py}">병음 ${py ? "숨기기" : "보기"}</button>` : ""}
    </div>
    ${prompt}
    <div class="opts" id="opts">
      ${q.opts.map((o, i) => {
        const sub = py && q.zhOpts && o.w ? `<small>${esc(LEX[o.w].p)}</small>` : "";
        return `<button class="opt ${q.zhOpts ? "zh zh-opt" : ""}" ${q.zhOpts ? 'lang="zh-CN"' : ""} data-i="${i}"><span class="k">${"ABCD"[i]}</span><span class="lbl"><span>${esc(o.label)}</span>${sub}</span></button>`;
      }).join("")}
    </div>
    <div id="after"></div>
  `;
  $("#quit").addEventListener("click", () => {
    if ((s.i === 0 && !s.answered) || confirm("그만하고 처음 화면으로 갈까요? (지금까지 틀린 문제는 저장돼요)")) { session = null; renderHome(); }
  });
  if ($("#py")) $("#py").addEventListener("click", () => { s.py = !s.py; const y = window.scrollY; renderQuestion(); window.scrollTo(0, y); });
  $("#opts").addEventListener("click", ev => {
    const b = ev.target.closest(".opt"); if (b) answer(Number(b.dataset.i));
  });
  if (s.answered) showAnswer();
}

function answer(i) {
  const s = session, q = s.qs[s.i];
  if (s.answered) return;
  s.answered = true; s.pick = i;
  const correct = i === q.answer;
  if (correct) s.right++; else s.missed.push(q);
  record(q.it.w, q.type, correct);
  showAnswer();
  $("#after").scrollIntoView({ behavior: "smooth", block: "start" });
}

/* answer panel: the word itself + every option explained (picked or not) */
function showAnswer() {
  const s = session, q = s.qs[s.i], it = q.it;
  const correct = s.pick === q.answer;
  document.querySelectorAll(".opt").forEach((b, j) => {
    b.disabled = true;
    if (j === q.answer) b.classList.add("ok");
    else if (j === s.pick) b.classList.add("bad");
  });
  const left = wrong[it.w + "|" + q.type];
  const status = correct
    ? (left ? `정답! 오답 노트에서 빠지려면 ${STREAK_TO_CLEAR - left.streak}번 더 맞혀야 해요` : "정답!")
    : "오답 — 오답 노트에 저장했어요";
  const ex = q.full || it.ex;
  const rows = q.opts.map((o, j) => {
    const L = o.w ? LEX[o.w] : null;
    const tags = (j === q.answer ? `<span class="tag ans">정답</span>` : "") + (j === s.pick && j !== q.answer ? `<span class="tag pick">내 선택</span>` : "");
    const head = L
      ? `<span class="ew zh" lang="zh-CN">${esc(o.w)}</span><span class="ep">${esc(L.p)}</span><span class="badge">${lvText(L.lv)}</span>`
      : `<span class="ep">${esc(o.label)}</span>`;
    return `<div class="ex-row ${j === q.answer ? "is-ans" : ""} ${j === s.pick && j !== q.answer ? "is-pick" : ""}">
      <span class="k">${"ABCD"[j]}</span>
      <div class="body"><div class="top">${head}${tags}</div>
        ${L ? `<div class="em">${esc(L.pos)} · ${esc(L.ko)}</div>` : ""}
        ${o.why ? `<div class="why">${esc(o.why)}</div>` : ""}
      </div></div>`;
  }).join("");
  $("#after").innerHTML = `
    <section class="card info ${correct ? "" : "wrong"}">
      <div class="verdict ${correct ? "ok" : "bad"}">${status}</div>
      <div class="head"><span class="w zh" lang="zh-CN">${esc(it.w)}</span><span class="p">${esc(it.p)}</span>
        <span class="badge">${lvText(it.lv)}</span><span class="badge">${esc(it.pos)}</span></div>
      <p class="meaning">${esc(it.ko)}</p>
      ${ex ? `<p class="ex zh ${s.py ? "py" : ""}" lang="zh-CN">${sentenceHtml(ex, s.py, it.w)}</p>` : ""}
      ${q.real ? `<div class="src">기출 빈칸: ${esc(srcText(q.src))}</div>` : (it.src.length ? `<div class="src">출처: ${esc(srcText(it.src))}</div>` : "")}
    </section>
    <section class="card explain">
      <h2>보기 해설</h2>
      ${rows}
    </section>
    <div class="sticky"><button class="btn" id="next">${s.i + 1 < s.qs.length ? "다음" : "결과 보기"}</button></div>
  `;
  $("#next").addEventListener("click", next);
}

function next() {
  const s = session;
  s.i++; s.answered = false; s.pick = -1; s.py = false;   // 병음은 문제마다 다시 꺼진 상태로 시작
  if (s.i < s.qs.length) { renderQuestion(); window.scrollTo(0, 0); } else renderResult();
}

function renderResult() {
  const s = session, n = s.qs.length;
  const wn = wrongEntries().length;
  $("#app").innerHTML = `
    <div class="score"><div class="num">${s.right} / ${n}</div><div class="pct">정답률 ${Math.round(s.right / n * 100)}%</div></div>
    ${s.missed.length ? `<section class="card"><h2>이번에 틀린 단어</h2><ul class="list">
      ${s.missed.map(q => `<li><span class="lw zh" lang="zh-CN">${esc(q.it.w)}</span>
        <span class="lm"><span class="p">${esc(q.it.p)}</span> · ${esc(q.it.ko)}<br><span class="t">${TYPE_LABEL[q.type]}</span></span></li>`).join("")}
    </ul></section>` : `<p class="empty">모두 맞혔어요!</p>`}
    <button class="btn" id="redo" ${wn ? "" : "disabled"}>오답만 풀기 (${wn})</button>
    <button class="btn secondary" id="home">처음으로</button>
  `;
  session = null;
  window.scrollTo(0, 0);
  $("#redo").addEventListener("click", startWrong);
  $("#home").addEventListener("click", renderHome);
}

function renderNotebook() {
  const es = wrongEntries().sort((a, b) => b.miss - a.miss || b.at - a.at);
  $("#app").innerHTML = `
    <div class="qtop"><button class="x" id="back" aria-label="뒤로">‹</button><h1 style="margin:0">오답 노트</h1></div>
    <p class="note" style="margin-bottom:12px">틀린 단어는 유형별로 저장되고, 이후 <b>연속 ${STREAK_TO_CLEAR}번</b> 맞히면 자동으로 빠져요.</p>
    <section class="card">
      ${es.length ? `<ul class="list" id="wl">
        ${es.map(e => { const L = LEX[e.w]; return `<li>
          <span class="lw zh" lang="zh-CN">${esc(e.w)}</span>
          <span class="lm"><span class="p">${esc(L.p)}</span> · ${esc(L.ko)}<br>
            <span class="t">${TYPE_LABEL[e.t]} · ${e.miss}번 틀림</span></span>
          <span class="dots" title="연속 정답">${"●".repeat(e.streak)}${"○".repeat(STREAK_TO_CLEAR - e.streak)}</span>
          <button class="del" data-k="${esc(e.w + "|" + e.t)}" aria-label="삭제">×</button></li>`; }).join("")}
      </ul>` : `<p class="empty">저장된 오답이 없어요.</p>`}
    </section>
    ${es.length ? `<button class="btn" id="redo">오답만 풀기 (${es.length})</button>
      <button class="btn secondary" id="clear">오답 노트 비우기</button>` : ""}

    <section class="card" style="margin-top:20px">
      <h2>백업 · 복원</h2>
      <p class="note">오답 기록은 이 기기의 브라우저에만 저장돼요. 폰을 바꾸거나 브라우저 데이터를 지우기 전에 백업해 두세요.</p>
      <button class="btn secondary" id="export">백업 코드 복사</button>
      <textarea id="io" class="hidden" placeholder="여기에 백업 코드를 붙여넣으세요"></textarea>
      <button class="btn secondary" id="import">백업 코드로 복원</button>
      <p class="note" id="msg"></p>
    </section>
  `;
  $("#back").addEventListener("click", renderHome);
  const wl = $("#wl");
  if (wl) wl.addEventListener("click", ev => {
    const b = ev.target.closest(".del"); if (!b) return;
    delete wrong[b.dataset.k]; saveWrong(); renderNotebook();
  });
  if ($("#redo")) $("#redo").addEventListener("click", startWrong);
  if ($("#clear")) $("#clear").addEventListener("click", () => {
    if (confirm("오답 노트를 모두 지울까요? 되돌릴 수 없어요.")) { wrong = {}; saveWrong(); renderNotebook(); }
  });
  const io = $("#io"), msg = $("#msg");
  $("#export").addEventListener("click", async () => {
    const code = JSON.stringify({ v: 1, wrong, settings });
    io.classList.remove("hidden"); io.value = code;
    try { await navigator.clipboard.writeText(code); msg.textContent = "복사했어요. 메모 앱 등에 붙여넣어 보관하세요."; }
    catch { io.select(); msg.textContent = "위 코드를 길게 눌러 전체 선택 후 복사하세요."; }
  });
  $("#import").addEventListener("click", () => {
    if (io.classList.contains("hidden")) { io.classList.remove("hidden"); io.value = ""; io.focus(); msg.textContent = "백업 코드를 붙여넣고 한 번 더 누르세요."; return; }
    try {
      const d = JSON.parse(io.value);
      if (!d || typeof d.wrong !== "object") throw 0;
      const n = Object.keys(d.wrong).length;
      if (!confirm(`백업의 오답 ${n}개를 현재 기록에 합칠까요?`)) return;
      for (const [k, e] of Object.entries(d.wrong)) {
        const cur = wrong[k];
        if (!cur || e.miss > cur.miss) wrong[k] = e;
      }
      saveWrong(); renderNotebook();
    } catch { msg.textContent = "백업 코드를 읽을 수 없어요. 전체를 정확히 붙여넣었는지 확인하세요."; }
  });
  window.scrollTo(0, 0);
}

/* keyboard (desktop): 1–4 / A–D to answer, P for pinyin, Enter for next */
document.addEventListener("keydown", ev => {
  if (!session || ev.target.tagName === "TEXTAREA") return;
  const k = ev.key.toLowerCase();
  const i = "1234".indexOf(k) >= 0 ? "1234".indexOf(k) : "abcd".indexOf(k);
  if (k === "p" && $("#py")) $("#py").click();
  else if (!session.answered && i >= 0 && i < session.qs[session.i].opts.length) answer(i);
  else if (session.answered && (k === "enter" || k === " ")) { ev.preventDefault(); next(); }
});

renderHome();
</script>
</body>
</html>
